<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dino Duel - Multiplayer</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
</head>
<body>
    <div class="lobby-container" id="lobby">
        <h2>Multiplayer Arena</h2>
        <input type="text" id="roomId" placeholder="Room code">
        <button id="createBtn">Create Room</button>
        <button id="joinBtn">Join Room</button>
        <div id="status"></div>
    </div>
    
    <div class="game-container" id="game" style="display: none;">
        <div class="player-board opponent-board">
            <h3>👤 OPPONENT</h3>
            <div class="field-grid">
                <div class="grid-row mirror-row" id="opponentTopRow"></div>
                <div class="grid-row mirror-row" id="opponentBottomRow"></div>
            </div>
            <div class="hand-area"><div class="hand-container" id="opponentHand"></div></div>
            <div class="deck-grave-stack"><div class="stack-item" id="opponentDeckCount">📖 DECK 0</div></div>
            <div class="energy-pile" id="opponentEnergyPile"></div>
        </div>
        
        <div class="field-zone">🌍 FIELD ZONE</div>
        
        <div class="player-board">
            <h3>🔥 YOU</h3>
            <div class="field-grid">
                <div class="grid-row" id="playerTopRow"></div>
                <div class="grid-row" id="playerBottomRow"></div>
            </div>
            <div class="hand-area"><div class="hand-container" id="playerHand"></div></div>
            <div class="deck-grave-stack"><div class="stack-item" id="playerDeckCount">📖 DECK 0</div></div>
            <div class="energy-pile" id="playerEnergyPile"></div>
        </div>
        
        <div class="phase-bar">
            <div class="phase-btn active" id="phaseButton">⚔️ MAIN PHASE</div>
            <button id="backBtn">🏠 Menu</button>
        </div>
        <div class="log" id="gameLog"></div>
    </div>

    <script type="module">
        import { createInitialState, drawCard, playDino, attachEnergy, attack, endTurn } from './js/battleLogic.js';
        import { getImagePath } from './js/utils.js';
        import { ALL_CARDS } from './js/cardData.js';
        
        const SERVER_URL = 'https://dinogame-production.up.railway.app';
        let socket = null;
        let playerIndex = null;
        let roomId = null;
        let battleState = null;
        
        function getDeck() {
            const saved = localStorage.getItem("dinoDecks");
            const decks = saved ? JSON.parse(saved) : { p1_deck1: [] };
            return decks.p1_deck1.length ? decks.p1_deck1 : ALL_CARDS.slice(0, 15).map(c => ({ id: c.id, category: c.category }));
        }
        
        function addLog(msg) {
            const logDiv = document.getElementById('gameLog');
            if(logDiv) logDiv.innerHTML = `<div>🦖 ${msg}</div>` + logDiv.innerHTML;
        }
        
        function renderUI() {
            if(!battleState) return;
            const myState = playerIndex === 1 ? battleState.p1 : battleState.p2;
            const oppState = playerIndex === 1 ? battleState.p2 : battleState.p1;
            
            document.getElementById('playerDeckCount').innerHTML = `📖 DECK ${myState.deck.length}`;
            document.getElementById('opponentDeckCount').innerHTML = `📖 DECK ${oppState.deck.length}`;
            
            // Player hand
            const handDiv = document.getElementById('playerHand');
            handDiv.innerHTML = '';
            myState.hand.forEach((card, idx) => {
                const div = document.createElement('div'); div.className = 'hand-card';
                const img = document.createElement('img');
                img.src = getImagePath(card.name);
                img.onerror = () => { img.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 160'%3E%3Crect width='120' height='160' fill='%23c09a6b'/%3E%3Ctext x='60' y='90' text-anchor='middle' fill='black'%3E" + card.name + "%3C/text%3E%3C/svg%3E"; };
                div.appendChild(img);
                div.onclick = () => {
                    if(playDino(battleState, playerIndex, idx)) {
                        socket.emit('gameAction', roomId, 'action', { type: 'playDino', idx });
                        renderUI();
                    }
                };
                handDiv.appendChild(div);
            });
            
            // Opponent hand (face down)
            const oppHand = document.getElementById('opponentHand');
            oppHand.innerHTML = '';
            for(let i=0;i<oppState.hand.length;i++) {
                const div = document.createElement('div'); div.className = 'hand-card';
                const img = document.createElement('img');
                img.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 160'%3E%3Crect width='120' height='160' fill='%23352a1a'/%3E%3Ctext x='60' y='90' text-anchor='middle' fill='%23dba14b'%3E?%3C/text%3E%3C/svg%3E";
                div.appendChild(img);
                oppHand.appendChild(div);
            }
            
            // Player dino zones
            const playerRow = document.getElementById('playerTopRow');
            playerRow.innerHTML = '';
            playerRow.innerHTML += `<div class="zone-card starter-zone"><img class="card-image" src="${getImagePath(myState.starterZone?.name || 'placeholder')}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 120 160%22%3E%3Crect width=%22120%22 height=%22160%22 fill=%22%23c09a6b%22/%3E%3Ctext x=%2260%22 y=%2290%22 text-anchor=%22middle%22 fill=%22black%22%3E⭐%3C/text%3E%3C/svg%3E'"><div class="card-stats"><span>❤️${myState.starterZone?.hp||0}</span></div></div>`;
            for(let i=0;i<4;i++) {
                let d = myState.dinoZones[i];
                let curHp = d ? d.hp - (d.damage||0) : 0;
                playerRow.innerHTML += `<div class="zone-card dino-zone" id="playerDino_${i}">
                    ${d ? `<div><img class="card-image" src="${getImagePath(d.name)}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 120 160%22%3E%3Crect width=%22120%22 height=%22160%22 fill=%22%23c09a6b%22/%3E%3Ctext x=%2260%22 y=%2290%22 text-anchor=%22middle%22 fill=%22black%22%3E${d.name}%3C/text%3E%3C/svg%3E'"><div class="card-stats"><span>❤️${curHp}/${d.hp}</span></div></div>` : `<div class="card-image" style="background:#5e3a2e;">Empty</div>`}
                </div>`;
            }
            
            // Opponent dino zones
            const oppRow = document.getElementById('opponentTopRow');
            oppRow.innerHTML = '';
            oppRow.innerHTML += `<div class="zone-card starter-zone"><img class="card-image" src="${getImagePath(oppState.starterZone?.name || 'placeholder')}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 120 160%22%3E%3Crect width=%22120%22 height=%22160%22 fill=%22%23c09a6b%22/%3E%3Ctext x=%2260%22 y=%2290%22 text-anchor=%22middle%22 fill=%22black%22%3E⭐%3C/text%3E%3C/svg%3E'"><div class="card-stats"><span>❤️${oppState.starterZone?.hp||0}</span></div></div>`;
            for(let i=0;i<4;i++) {
                let d = oppState.dinoZones[i];
                let curHp = d ? d.hp - (d.damage||0) : 0;
                oppRow.innerHTML += `<div class="zone-card dino-zone" id="opponentDino_${i}">
                    ${d ? `<div><img class="card-image" src="${getImagePath(d.name)}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 120 160%22%3E%3Crect width=%22120%22 height=%22160%22 fill=%22%23c09a6b%22/%3E%3Ctext x=%2260%22 y=%2290%22 text-anchor=%22middle%22 fill=%22black%22%3E${d.name}%3C/text%3E%3C/svg%3E'"><div class="card-stats"><span>❤️${curHp}/${d.hp}</span></div></div>` : `<div class="card-image" style="background:#5e3a2e;">Empty</div>`}
                </div>`;
            }
            
            // Energy piles
            const playerEnergy = document.getElementById('playerEnergyPile');
            playerEnergy.innerHTML = '';
            myState.energyPile.forEach((eng, idx) => {
                const ediv = document.createElement('div'); ediv.className = 'energy-pile-card';
                ediv.setAttribute('draggable','true');
                ediv.ondragstart = (e) => e.dataTransfer.setData('text/plain', JSON.stringify({idx}));
                const img = document.createElement('img');
                img.src = getImagePath(eng.name);
                ediv.appendChild(img);
                playerEnergy.appendChild(ediv);
            });
            
            for(let i=0;i<4;i++) {
                const zone = document.getElementById(`playerDino_${i}`);
                zone.ondragover = (e) => e.preventDefault();
                zone.ondrop = (e) => {
                    e.preventDefault();
                    const data = JSON.parse(e.dataTransfer.getData('text/plain'));
                    if(attachEnergy(battleState, playerIndex, i, data.idx)) {
                        socket.emit('gameAction', roomId, 'action', { type: 'attachEnergy', zone: i, energyIdx: data.idx });
                        renderUI();
                    }
                };
            }
        }
        
        function startGame() {
            const deck = getDeck();
            const opponentDeck = [...deck];
            battleState = createInitialState(deck, opponentDeck);
            for(let i=0;i<6;i++) {
                drawCard(battleState, 1);
                drawCard(battleState, 2);
            }
            renderUI();
            addLog("Game started!");
        }
        
        document.getElementById('createBtn').onclick = () => {
            roomId = document.getElementById('roomId').value.trim();
            if(!roomId) return;
            socket = io(SERVER_URL);
            socket.emit('createRoom', roomId, (res) => {
                if(res.success) {
                    playerIndex = 1;
                    document.getElementById('lobby').style.display = 'none';
                    document.getElementById('game').style.display = 'block';
                    startGame();
                    setupSocket();
                } else alert(res.message);
            });
        };
        
        document.getElementById('joinBtn').onclick = () => {
            roomId = document.getElementById('roomId').value.trim();
            if(!roomId) return;
            socket = io(SERVER_URL);
            socket.emit('joinRoom', roomId, (res) => {
                if(res.success) {
                    playerIndex = 2;
                    document.getElementById('lobby').style.display = 'none';
                    document.getElementById('game').style.display = 'block';
                    startGame();
                    setupSocket();
                } else alert(res.message);
            });
        };
        
        function setupSocket() {
            socket.on('opponentAction', (action, data) => {
                addLog("Opponent moved");
                renderUI();
            });
            socket.on('opponentDisconnected', () => {
                addLog("Opponent disconnected!");
            });
        }
        
        document.getElementById('backBtn').onclick = () => window.location.href = 'index.html';
    </script>
</body>
</html>
