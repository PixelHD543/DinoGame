<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Dino Duel TCG - Multiplayer Arena</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            background: linear-gradient(145deg, #1a3a2a 0%, #0a1f12 100%);
            font-family: 'Segoe UI', Roboto, 'Trebuchet MS', sans-serif;
            margin: 0;
            padding: 20px;
            color: #f7f3d9;
        }
        .lobby {
            max-width: 600px;
            margin: 100px auto;
            background: #2c2116cc;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            padding: 40px;
            text-align: center;
            border: 3px solid #e2b13b;
        }
        .lobby input, .lobby button {
            padding: 12px 20px;
            margin: 10px;
            font-size: 1.1rem;
            border-radius: 40px;
            border: none;
        }
        .lobby input { background: #fef0cf; color: #2c1a0e; width: 200px; }
        .lobby button { background: #e6a53b; cursor: pointer; font-weight: bold; }
        .status { margin-top: 20px; font-size: 1.2rem; color: #ffdd99; }
        .game-container {
            max-width: 1600px;
            margin: 0 auto;
            background: #2c2116cc;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            padding: 30px;
            border: 3px solid #e2b13b;
        }
        .player-board {
            background: #1e2a1cdd;
            border-radius: 40px;
            padding: 20px;
            margin-bottom: 30px;
            border: 2px solid #c4913a;
        }
        .opponent-board .card-image { transform: rotate(180deg); }
        .field-grid { display: flex; flex-direction: column; gap: 20px; margin-bottom: 20px; }
        .grid-row { display: grid; grid-template-columns: repeat(5, minmax(130px, 180px)); justify-content: center; gap: 15px; }
        .zone-card {
            background: #4a2e1e;
            border-radius: 20px;
            padding: 8px;
            border: 3px solid #c97e3a;
            position: relative;
        }
        .starter-zone { background: #5e3a1f; border-color: #ffb347; cursor: pointer; }
        .energy-zone { background: #c9510c; border-color: #ffdf80; }
        .card-image {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            background: #c09a6b;
            border-radius: 16px;
            cursor: pointer;
        }
        .energy-stack {
            position: absolute;
            bottom: 5px;
            right: 5px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .energy-card {
            width: 35px;
            height: 28px;
            background: radial-gradient(#ffd966, #e6a800);
            border-radius: 6px;
            margin-top: -22px;
        }
        .energy-card:first-child { margin-top: 0; }
        .energy-count {
            background: #000000cc;
            border-radius: 20px;
            padding: 2px 6px;
            font-size: 0.7rem;
            font-weight: bold;
            color: gold;
        }
        .card-stats {
            background: #1f1a0fcc;
            margin-top: 8px;
            padding: 5px;
            border-radius: 16px;
            text-align: center;
            display: flex;
            justify-content: center;
            gap: 8px;
        }
        .action-buttons { display: flex; gap: 6px; margin-top: 8px; justify-content: center; }
        .action-btn {
            background: #3e2a1c;
            color: #ffeaac;
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 30px;
            cursor: pointer;
            border: none;
        }
        .action-btn.attack { background: #b64516; }
        .action-btn.evolve { background: #6a4e2e; }
        .hand-area {
            background: #35281599;
            border-radius: 40px;
            padding: 15px;
            margin-top: 20px;
            overflow-x: auto;
        }
        .hand-container { display: inline-flex; gap: 12px; padding: 8px; }
        .hand-card {
            background: #2d2418cc;
            border-radius: 16px;
            width: 110px;
            border: 2px solid #dba14b;
            display: inline-block;
            cursor: pointer;
        }
        .hand-card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 14px; }
        .phase-bar { display: flex; gap: 20px; justify-content: center; margin: 20px 0; }
        .phase-btn {
            background: #3e2a1c;
            color: #ffeaac;
            border: 2px solid #d4a259;
            padding: 10px 30px;
            border-radius: 50px;
            cursor: pointer;
        }
        .phase-btn.active { background: #e6a53b; color: #1f2f0c; border-color: #ffdd88; }
        .deck-grave-stack { display: flex; gap: 15px; justify-content: flex-end; margin-top: 20px; }
        .stack-item {
            background: #1f1a0fcc;
            border-radius: 40px;
            padding: 8px 16px;
            cursor: pointer;
            border: 2px solid #b87c3a;
        }
        .energy-pile {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 12px;
            background: #2d2418aa;
            border-radius: 30px;
            padding: 12px;
        }
        .energy-pile-card { width: 60px; cursor: grab; }
        .energy-pile-card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 10px; }
        .log {
            background: #0f0f0fcc;
            border-radius: 32px;
            padding: 20px;
            max-height: 180px;
            overflow-y: auto;
            font-size: 0.9rem;
            margin-top: 20px;
        }
        .targetable-glow { box-shadow: 0 0 0 4px #00ff00, 0 0 0 8px #00aa00; cursor: pointer; }
        @media (max-width: 1000px) {
            .grid-row { grid-template-columns: repeat(5, minmax(100px, 130px)); gap: 8px; }
            .hand-card { width: 85px; }
        }
    </style>
</head>
<body>
    <div id="lobby" class="lobby">
        <h2>Multiplayer Arena</h2>
        <input type="text" id="roomId" placeholder="Room code (e.g., room123)">
        <button id="joinBtn">Join / Create Game</button>
        <div id="lobbyStatus" class="status">Waiting...</div>
    </div>
    <div id="gameArea" style="display: none;">
        <div class="game-container">
            <div class="player-board opponent-board">
                <h3 id="opponentName">👤 Opponent</h3>
                <div class="field-grid">
                    <div class="grid-row mirror-row" id="opponentTopRow"></div>
                    <div class="grid-row mirror-row" id="opponentBottomRow"></div>
                </div>
                <div class="hand-area"><div class="hand-container" id="opponentHand"></div></div>
                <div class="deck-grave-stack">
                    <div class="stack-item" id="opponentDeckCount">📖 DECK 0</div>
                </div>
                <div class="energy-pile" id="opponentEnergyPile"></div>
            </div>
            <div style="background:#2d2418aa; border-radius:48px; margin:24px 0; padding:20px; text-align:center;">🌍 FIELD ZONE</div>
            <div class="player-board">
                <h3>🔥 You (Player <span id="playerId">?</span>)</h3>
                <div class="field-grid">
                    <div class="grid-row" id="playerTopRow"></div>
                    <div class="grid-row" id="playerBottomRow"></div>
                </div>
                <div class="hand-area"><div class="hand-container" id="playerHand"></div></div>
                <div class="deck-grave-stack">
                    <div class="stack-item" id="playerDeckCount">📖 DECK 0</div>
                </div>
                <div class="energy-pile" id="playerEnergyPile"></div>
            </div>
            <div class="phase-bar">
                <div class="phase-btn active" id="phaseButton">⚔️ MAIN PHASE (click to advance)</div>
            </div>
            <div class="log" id="gameLog"></div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <script>
        // Card database (simplified for multiplayer – same as single player)
        const ALL_CARDS = [
            { id:"Baby rex", name:"Baby rex", type:"fire", stage:1, power:1500, hp:2000, effect:"", category:"dino" },
            { id:"T-rex", name:"T-rex", type:"fire", stage:2, power:3000, hp:3500, effect:"", category:"dino" },
            { id:"Baby Triceratops", name:"Baby Triceratops", type:"grass", stage:1, power:2000, hp:2500, effect:"", category:"dino" },
            { id:"Triceratops", name:"Triceratops", type:"grass", stage:2, power:4000, hp:4000, effect:"", category:"dino" },
            { id:"Baby Velociraptor", name:"Baby Velociraptor", type:"electric", stage:1, power:1000, hp:800, effect:"", category:"dino" },
            { id:"Velociraptor", name:"Velociraptor", type:"electric", stage:1, power:500, hp:500, effect:"", category:"dino" }
        ];
        const ENERGY_TYPES = ["Fire","Water","Grass","Ground","Electric","Normal","Wind"];
        function createEnergyCard(t) { return { name:`${t} Energy`, category:"energy" }; }
        function createEnergyPile() { let pile = []; for(let i=0;i<3;i++) ENERGY_TYPES.forEach(t => pile.push(createEnergyCard(t))); return shuffle(pile); }
        function shuffle(arr) { for(let i=arr.length-1;i>0;i--){ let j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
        function getImagePath(name) { return `images/${encodeURIComponent(name)}.png`; }

        let socket = null;
        let playerIndex = null;
        let roomId = null;
        let gameState = null;
        let currentPhase = 'main';
        let pendingAttacker = null;

        // DOM elements
        const lobbyDiv = document.getElementById('lobby');
        const gameArea = document.getElementById('gameArea');
        const roomInput = document.getElementById('roomId');
        const joinBtn = document.getElementById('joinBtn');
        const lobbyStatus = document.getElementById('lobbyStatus');
        const phaseButton = document.getElementById('phaseButton');
        const playerIdSpan = document.getElementById('playerId');

        // Connect to server (Railway URL – CHANGE THIS TO YOUR RAILWAY URL)
        const SERVER_URL = 'https://YOUR-RAILWAY-URL.up.railway.app'; // Replace with your actual Railway URL
        
        joinBtn.onclick = () => {
            roomId = roomInput.value.trim();
            if (!roomId) {
                lobbyStatus.innerText = 'Please enter a room code';
                return;
            }
            socket = io(SERVER_URL);
            socket.on('connect', () => {
                socket.emit('joinGame', roomId, (response) => {
                    if (response.success) {
                        playerIndex = response.playerIndex;
                        playerIdSpan.innerText = playerIndex;
                        lobbyDiv.style.display = 'none';
                        gameArea.style.display = 'block';
                        lobbyStatus.innerText = '';
                        initGame();
                    } else {
                        lobbyStatus.innerText = response.message;
                    }
                });
            });
            socket.on('gameStart', (data) => {
                addLog('Game started! ' + data.message);
            });
            socket.on('opponentAction', (action, data) => {
                handleOpponentAction(action, data);
            });
            socket.on('opponentDisconnected', () => {
                addLog('Opponent disconnected. Game will end.');
                setTimeout(() => location.reload(), 3000);
            });
        };

        function initGame() {
            // Initialise local game state (simplified for demo)
            gameState = {
                p1: { deck: shuffle([...ALL_CARDS]), hand: [], dinoZones: new Array(4).fill(null), researchZones: new Array(4).fill(null), starterZone: null, graveyard: [], energyPile: createEnergyPile(), points: 0 },
                p2: { deck: shuffle([...ALL_CARDS]), hand: [], dinoZones: new Array(4).fill(null), researchZones: new Array(4).fill(null), starterZone: null, graveyard: [], energyPile: createEnergyPile(), points: 0 },
                turn: 1,
                phase: 'main',
                drawnThisTurn: false,
                evolutionUsedThisTurn: false
            };
            // Draw starting hands
            for (let i = 0; i < 6; i++) {
                if (gameState.p1.deck.length) gameState.p1.hand.push(gameState.p1.deck.pop());
                if (gameState.p2.deck.length) gameState.p2.hand.push(gameState.p2.deck.pop());
            }
            renderUI();
        }

        function handleOpponentAction(action, data) {
            // Apply opponent's action to local game state
            if (action === 'playCard') {
                // Simplified: opponent plays a card
                addLog(`Opponent played a card.`);
            } else if (action === 'attack') {
                addLog(`Opponent attacked!`);
            }
            renderUI();
        }

        function sendAction(action, data) {
            if (socket) socket.emit('gameAction', roomId, action, data);
        }

        function addLog(msg) {
            const logDiv = document.getElementById('gameLog');
            if (logDiv) logDiv.innerHTML = `<div>🦖 ${msg}</div>` + logDiv.innerHTML;
            if (logDiv.children.length > 15) logDiv.removeChild(logDiv.lastChild);
        }

        function nextPhase() {
            if (currentPhase === 'main') currentPhase = 'battle';
            else if (currentPhase === 'battle') currentPhase = 'end';
            else if (currentPhase === 'end') currentPhase = 'main';
            phaseButton.innerText = `⚔️ ${currentPhase.toUpperCase()} PHASE (click to advance)`;
            renderUI();
        }
        phaseButton.onclick = nextPhase;

        function renderUI() {
            if (!gameState) return;
            const myState = playerIndex === 1 ? gameState.p1 : gameState.p2;
            const oppState = playerIndex === 1 ? gameState.p2 : gameState.p1;
            
            // Update deck counts
            document.getElementById('playerDeckCount').innerText = `📖 DECK ${myState.deck.length}`;
            document.getElementById('opponentDeckCount').innerText = `📖 DECK ${oppState.deck.length}`;
            
            // Render player hand
            const playerHandDiv = document.getElementById('playerHand');
            playerHandDiv.innerHTML = '';
            myState.hand.forEach((card, idx) => {
                const cardDiv = document.createElement('div'); cardDiv.className = 'hand-card';
                const img = document.createElement('img');
                img.src = getImagePath(card.name);
                img.onerror = () => { img.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 160'%3E%3Crect width='120' height='160' fill='%23c09a6b'/%3E%3Ctext x='60' y='90' text-anchor='middle' fill='black'%3E" + card.name + "%3C/text%3E%3C/svg%3E"; };
                cardDiv.appendChild(img);
                cardDiv.onclick = () => playCard(idx);
                playerHandDiv.appendChild(cardDiv);
            });
            
            // Render opponent hand (face down)
            const oppHandDiv = document.getElementById('opponentHand');
            oppHandDiv.innerHTML = '';
            for (let i = 0; i < oppState.hand.length; i++) {
                const cardDiv = document.createElement('div'); cardDiv.className = 'hand-card';
                const img = document.createElement('img');
                img.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 160'%3E%3Crect width='120' height='160' fill='%23352a1a'/%3E%3Ctext x='60' y='90' text-anchor='middle' fill='%23dba14b' font-size='30'%3E?%3C/text%3E%3C/svg%3E";
                cardDiv.appendChild(img);
                oppHandDiv.appendChild(cardDiv);
            }
            
            // Render dino zones (simplified – just show names)
            const playerTopRow = document.getElementById('playerTopRow');
            playerTopRow.innerHTML = '';
            myState.dinoZones.forEach((dino, i) => {
                const zoneDiv = document.createElement('div'); zoneDiv.className = 'zone-card dino-zone';
                if (dino) {
                    zoneDiv.innerHTML = `<img class="card-image" src="${getImagePath(dino.name)}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 120 160%22%3E%3Crect width=%22120%22 height=%22160%22 fill=%22%23c09a6b%22/%3E%3Ctext x=%2260%22 y=%2290%22 text-anchor=%22middle%22 fill=%22black%22%3E${dino.name}%3C/text%3E%3C/svg%3E'"><div class="card-stats"><span>❤️${dino.hp}</span></div><div class="action-buttons"><button class="action-btn attack" onclick="selectAttacker(${i})">⚔️ ATTACK</button></div>`;
                } else {
                    zoneDiv.innerHTML = '<div class="card-image" style="background:#5e3a2e; display:flex; align-items:center; justify-content:center;">Empty</div>';
                }
                playerTopRow.appendChild(zoneDiv);
            });
            
            // Opponent dino zones
            const oppTopRow = document.getElementById('opponentTopRow');
            oppTopRow.innerHTML = '';
            oppState.dinoZones.forEach((dino, i) => {
                const zoneDiv = document.createElement('div'); zoneDiv.className = 'zone-card dino-zone';
                if (dino) {
                    zoneDiv.innerHTML = `<img class="card-image" src="${getImagePath(dino.name)}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 120 160%22%3E%3Crect width=%22120%22 height=%22160%22 fill=%22%23c09a6b%22/%3E%3Ctext x=%2260%22 y=%2290%22 text-anchor=%22middle%22 fill=%22black%22%3E${dino.name}%3C/text%3E%3C/svg%3E'"><div class="card-stats"><span>❤️${dino.hp}</span></div>`;
                } else {
                    zoneDiv.innerHTML = '<div class="card-image" style="background:#5e3a2e; display:flex; align-items:center; justify-content:center;">Empty</div>';
                }
                oppTopRow.appendChild(zoneDiv);
            });
            
            // Energy piles (simplified)
            const playerEnergyDiv = document.getElementById('playerEnergyPile');
            playerEnergyDiv.innerHTML = '';
            myState.energyPile.forEach((eng, idx) => {
                const ediv = document.createElement('div'); ediv.className = 'energy-pile-card';
                const img = document.createElement('img');
                img.src = getImagePath(eng.name);
                img.onerror = () => { img.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 100'%3E%3Crect width='80' height='100' fill='%23c09a6b'/%3E%3Ctext x='40' y='60' text-anchor='middle' fill='black'%3E⚡%3C/text%3E%3C/svg%3E"; };
                ediv.appendChild(img);
                playerEnergyDiv.appendChild(ediv);
            });
            
            const oppEnergyDiv = document.getElementById('opponentEnergyPile');
            oppEnergyDiv.innerHTML = '';
            oppState.energyPile.forEach(() => {
                const ediv = document.createElement('div'); ediv.className = 'energy-pile-card';
                const img = document.createElement('img');
                img.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 100'%3E%3Crect width='80' height='100' fill='%23352a1a'/%3E%3Ctext x='40' y='60' text-anchor='middle' fill='%23dba14b'%3E?%3C/text%3E%3C/svg%3E";
                ediv.appendChild(img);
                oppEnergyDiv.appendChild(ediv);
            });
        }
        
        function playCard(handIdx) {
            if (currentPhase !== 'main') { addLog("Can only play cards during Main Phase."); return; }
            const myState = playerIndex === 1 ? gameState.p1 : gameState.p2;
            const card = myState.hand[handIdx];
            if (!card) return;
            if (card.category === 'dino') {
                let empty = myState.dinoZones.findIndex(z => !z);
                if (empty !== -1) {
                    myState.dinoZones[empty] = {...card, damage:0, energyAttached:[]};
                    myState.hand.splice(handIdx,1);
                    addLog(`Played ${card.name}.`);
                    sendAction('playCard', { handIdx, cardId: card.id });
                    renderUI();
                } else alert("No free dino zone");
            }
        }
        
        function selectAttacker(zoneIdx) {
            if (currentPhase !== 'battle') { addLog("Can only attack during Battle Phase."); return; }
            pendingAttacker = zoneIdx;
            // Highlight opponent's dinos
            for (let i = 0; i < 4; i++) {
                const zoneElem = document.getElementById(`opponentTopRow`).children[i];
                if (zoneElem && gameState.p2.dinoZones[i]) {
                    zoneElem.classList.add('targetable-glow');
                    zoneElem.onclick = () => executeAttack(i);
                }
            }
        }
        
        function executeAttack(targetIdx) {
            const myState = playerIndex === 1 ? gameState.p1 : gameState.p2;
            const oppState = playerIndex === 1 ? gameState.p2 : gameState.p1;
            const attacker = myState.dinoZones[pendingAttacker];
            const defender = oppState.dinoZones[targetIdx];
            if (!attacker || !defender) return;
            let discard = prompt(`Discard energies (0-${attacker.energyAttached?.length||0})`);
            discard = Math.min(parseInt(discard)||0, attacker.energyAttached?.length||0);
            for(let i=0;i<discard;i++) attacker.energyAttached.pop();
            let damage = attacker.power + discard*1000;
            defender.damage = (defender.damage||0) + damage;
            addLog(`${attacker.name} attacks ${defender.name} for ${damage} damage.`);
            if(defender.damage >= defender.hp) {
                const idx = oppState.dinoZones.findIndex(d=>d===defender);
                oppState.graveyard.push(defender);
                oppState.dinoZones[idx] = null;
                myState.points++;
                addLog(`${defender.name} destroyed!`);
            }
            clearAttackGlow();
            pendingAttacker = null;
            renderUI();
        }
        
        function clearAttackGlow() {
            for (let i = 0; i < 4; i++) {
                const zoneElem = document.getElementById(`opponentTopRow`).children[i];
                if (zoneElem) {
                    zoneElem.classList.remove('targetable-glow');
                    zoneElem.onclick = null;
                }
            }
        }
        
        window.selectAttacker = selectAttacker;
    </script>
</body>
</html>
